name: Build kernel

on:
  push:
    paths:
      - "ver"
      - ".config"
      - "build.sh"
      - "fw/**"
      - ".github/workflows/kbuild.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex libncurses-dev libssl-dev libelf-dev bc zstd xz-utils

      - name: Download and build kernel
        run: bash build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(head -n1 ver)
          assets=("kext/arch/x86/boot/bzImage" "kext/.config")
          notes="Stable kernel $version for the Dell Inspiron 5559; the blobs in fw/ are embedded via CONFIG_EXTRA_FIRMWARE."
          gh release create "$version" "${assets[@]}" \
            --title "Kernel $version" --notes "$notes" \
            || gh release upload "$version" "${assets[@]}" --clobber
